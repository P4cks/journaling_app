name: journaling_app_rewrite
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.2.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.0
  uuid: ^4.5.3
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  table_calendar: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  hugeicons: ^1.1.7
  http: ^1.2.0
  geolocator: ^14.0.0
  image_picker: ^1.1.0
  video_player: ^2.9.2
  record: ^5.1.2
  audioplayers: ^6.7.1
  fl_chart: ^0.69.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_animate: ^4.5.0
  purchases_flutter: ^10.2.0
  purchases_ui_flutter: ^10.2.0
  flutter_colorpicker: ^1.1.0
  package_info_plus: ^10.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.1
  build_runner: ^2.15.0

# The `record` 5.2.1 meta-package caps record_linux at <1.0.0, so pub
# resolves the stale record_linux 0.7.2. That version never implemented
# the breaking additions (startStream, hasPermission({request})) that
# landed in record_platform_interface 1.5/1.6 — which the newer
# record_android/record_web impls require — so the iOS build's Dart
# kernel snapshot (which compiles every federated platform package's
# Dart) fails with "RecordLinux is missing implementations". Override to
# record_linux 1.3.1, which targets platform_interface ^1.5.0 and
# implements the modern interface. (We only ship iOS + Android, but the
# Linux package's Dart still has to compile.)
dependency_overrides:
  record_linux: ^1.3.1


flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    # Tileable paper grain for the warm tactile journal background (GUS-85),
    # painted at low opacity via PaperBackground.
    - assets/textures/paper_grain.png

  # House type system (GUS-84). Both are bundled OFL variable fonts — a
  # single file per family carries every weight; Flutter maps `FontWeight`
  # to the `wght` axis automatically. Fraunces also exposes `opsz`/`SOFT`
  # axes driven via `FontVariation` in app_typography.dart. We bundle the
  # TTFs rather than fetch at runtime (no `google_fonts` package).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
